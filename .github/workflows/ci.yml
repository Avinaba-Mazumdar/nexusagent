name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/backend
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            # Tests marked `db` are skipped unless TEST_DATABASE_URL points at a disposable database.
            - run: uv run pytest -q
              env:
                  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    contracts:
        # packages/contracts/src/generated.ts is generated from the API's OpenAPI schema; fail on drift.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: uv sync --frozen --project apps/backend
            - run: pnpm install --frozen-lockfile
            - run: pnpm contracts:generate
            - run: git diff --exit-code -- packages/contracts

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @nexusagent/contracts build
            - run: pnpm --filter @nexusagent/frontend typecheck
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm --filter @nexusagent/frontend test
            - run: pnpm --filter @nexusagent/frontend build
              env:
                  NEXT_PUBLIC_API_URL: https://api.example.com
