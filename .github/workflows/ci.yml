name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg18
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: nexus_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
        defaults:
            run:
                working-directory: apps/backend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
              with:
                  enable-cache: true
                  cache-dependency-glob: apps/backend/uv.lock
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            # Tests marked `db` run against the service container above; a silent skip fails the job.
            - run: uv run pytest -q -rs | tee pytest.out
              env:
                  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_test
            - run: '! grep -q SKIPPED pytest.out'

    contracts:
        # packages/contracts/src/generated.ts is generated from the API's OpenAPI schema; fail on drift.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
              with:
                  enable-cache: true
                  cache-dependency-glob: apps/backend/uv.lock
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: uv sync --frozen --project apps/backend
            - run: pnpm install --frozen-lockfile
            - run: pnpm contracts:generate
            - run: git diff --exit-code -- packages/contracts

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter @nexusagent/frontend typecheck
            - run: pnpm lint --deny-warnings
            - run: pnpm format:check
            - run: pnpm --filter @nexusagent/frontend test
            - run: pnpm --filter @nexusagent/frontend build
              env:
                  NEXT_PUBLIC_API_URL: https://api.example.com

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod --audit-level=high
            - run: uv sync --frozen
              working-directory: apps/backend
            - run: uv run --with pip-audit pip-audit --skip-editable
              working-directory: apps/backend
