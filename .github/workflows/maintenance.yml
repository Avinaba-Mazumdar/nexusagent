name: Maintenance

# Enforces the retention promised in the privacy policy: guests inactive for 24 h and audit rows
# older than 30 days are deleted (scripts/prune_guests.py). Runs every 6 hours so a guest is
# removed at most ~6 h after its 24 h window ends.
on:
    schedule:
        - cron: '17 */6 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    prune:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
            - run: uv sync --frozen --project apps/backend
            - run: uv run --project apps/backend python scripts/prune_guests.py
              env:
                  # The script only needs the database; "development" avoids requiring the API's secrets.
                  ENVIRONMENT: development
                  NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
