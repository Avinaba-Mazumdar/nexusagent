[project]
name = "nexusagent-backend"
version = "0.1.0-alpha"
description = "NexusAgent Autonomous Architecture Intelligence & Systems Design Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.15.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "numpy>=2.0.0",
    "pgvector>=0.5.0",
    "langgraph>=1.2.12",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
