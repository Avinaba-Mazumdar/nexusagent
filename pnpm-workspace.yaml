packages:
    - 'apps/*'
    - 'packages/*'
allowBuilds:
    unrs-resolver: true
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
overrides:
    vite@*: 'catalog:'
    'dompurify@<3.4.17': 3.4.17
    'katex@<0.18.2': 0.18.2
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
